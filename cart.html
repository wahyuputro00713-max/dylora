<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keranjang Belanja | DYLORA</title>
    <link rel="icon" type="image/png" href="Asset/DYLORA_20260426_153607_0000.png" />
    <link rel="apple-touch-icon" href="Asset/DYLORA_20260426_153607_0000.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/cart.css" />
  </head>
  <body>
    <header class="cart-header">
      <nav class="navbar container">
        <a class="brand" href="index.html">
          <img src="Asset/DYLORA_20260426_153607_0000.png" alt="Logo DYLORA" />
          <span>DYLORA</span>
        </a>
        <a class="btn-back" href="index.html">← Lanjut Belanja</a>
      </nav>
    </header>

    <main class="container cart-layout">
      <section>
        <div class="section-title">
          <p class="tag">Checkout Step</p>
          <h1>Keranjang Kamu</h1>
          <p class="muted">Desain modern, simpel, dan siap checkout cepat.</p>
        </div>

        <div id="cartList" class="cart-list"></div>

        <article id="emptyState" class="empty-state hidden">
          <h2>Keranjang masih kosong.</h2>
          <p>Yuk pilih koleksi terbaru DYLORA biar style kamu makin standout ✨</p>
          <a href="index.html" class="btn-primary">Mulai Belanja</a>
        </article>
      </section>

      <aside class="checkout-card">
        <h2>Ringkasan Belanja</h2>
        <div class="summary-row">
          <span>Total Item</span>
          <strong id="summaryItems">0</strong>
        </div>
        <div class="summary-row">
          <span>Subtotal</span>
          <strong id="summarySubtotal">Rp0</strong>
        </div>
        <div class="summary-row savings">
          <span>Hemat</span>
          <strong id="summarySavings">Rp0</strong>
        </div>
        <div class="summary-row total">
          <span>Total Bayar</span>
          <strong id="summaryTotal">Rp0</strong>
        </div>

        <form id="voucherForm" class="voucher-form">
          <input id="voucherInput" type="text" placeholder="Masukkan kode voucher" />
          <button type="submit">Pakai</button>
        </form>

        <button id="checkoutBtn" class="checkout-btn">Checkout Sekarang</button>
      </aside>
    </main>

    <script src="js/cart.js"></script>
  </body>
</html>
